<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Football Value Bets</title>

<style>

table{
width:100%;
border-collapse:collapse;
}

td,th{
border:1px solid black;
padding:6px;
text-align:center;
}

.green{
background:#7CFC00;
}

</style>

</head>

<body>

<h1>Football Value Bet Scanner</h1>

<table>

<thead>

<tr>

<th>League</th>
<th>Date Moscow</th>
<th>Home</th>
<th>Away</th>

<th>Home Value</th>
<th>Draw Value</th>
<th>Away Value</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>

<script>

fetch("/matches")

.then(r=>r.json())

.then(data=>{

const table=document.getElementById("table")

data.forEach(m=>{

let row=document.createElement("tr")

row.innerHTML=`

<td>${m.league}</td>
<td>${m.date}</td>
<td>${m.home}</td>
<td>${m.away}</td>

<td class="${m.home_value>5?'green':''}">${m.home_value}%</td>
<td class="${m.draw_value>5?'green':''}">${m.draw_value}%</td>
<td class="${m.away_value>5?'green':''}">${m.away_value}%</td>

`

table.appendChild(row)

})

})

</script>

</body>

</html>

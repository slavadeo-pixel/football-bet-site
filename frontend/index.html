<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Football Value Bets</title>

<style>

table{
border-collapse: collapse;
width:100%;
}

th,td{
border:1px solid black;
padding:6px;
text-align:center;
}

.green{
background:#8BC34A;
}

.yellow{
background:#FFEB3B;
}

.red{
background:#F44336;
}

</style>

</head>

<body>

<h1>Football Value Bets (14 дней вперед)</h1>

<table>

<thead>

<tr>

<th>Лига</th>
<th>Дата (Москва)</th>
<th>Хозяева</th>
<th>Гости</th>

<th>Home Value</th>
<th>Draw Value</th>
<th>Away Value</th>

<th>Рекомендация</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>

<script>

fetch("/matches")

.then(r=>r.json())

.then(data=>{

const table=document.getElementById("table")

data.forEach(m=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${m.league}</td>

<td>${m.date}</td>

<td>${m.home_team}</td>

<td>${m.away_team}</td>

<td class="${m.highlight.home}">${m.value.home}%</td>

<td class="${m.highlight.draw}">${m.value.draw}%</td>

<td class="${m.highlight.away}">${m.value.away}%</td>

<td>${m.recommendations.join(", ")}</td>

`

table.appendChild(row)

})

})

</script>

</body>

</html>
